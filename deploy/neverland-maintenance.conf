# Temporary replacement for the enabled neverland.conf site.
server {
    listen 80;
    server_name ariari.art portal.ariari.art;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ariari.art portal.ariari.art;
    ssl_certificate /etc/letsencrypt/live/ariari.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ariari.art/privkey.pem;

    root /var/www/neverland/maintenance;
    add_header Cache-Control "no-store" always;
    error_page 404 503 =503 /_maintenance.html;

    location = /_maintenance.html {
        internal;
        alias /var/www/neverland/maintenance/404.html;
    }
    location = /tokens.css { try_files $uri =404; }
    location ~ ^/assets/fonts/portal/(Doto|Inter)\.woff2$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location / { return 503; }
}
